<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                background-color: #888888;
                color: #000000;
                font-family: comic sans ms, cursive, sans-serif;
                text-align: center;
                font-size: 110%;
                margin: 0;
                padding-top: 40px;
            }

            img {
                display: block;
                margin: 40px auto 20px auto;
            }
            a {
                text-decoration: none;
            }

        </style>
        <link rel="stylesheet" type="text/css" href="style.css" />
    </head>

    <body
        style="background-image: url(./mandel.png); height: 100vh; background-size: cover; background-position: right center; background-repeat: no-repeat; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <div style=" 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 42px; 
            background-color: rgba(255, 255, 255, 0.75); 
            display: flex; 
            align-items: center; 
            padding-left: 10px; 
            color: #000000; 
            font-size: 20px; 
            z-index: 999; 
        ">
            <p class="openbutton"
                id="welcomeopen">
                goopOS
            </p>
            <img
                class="openbutton"
                id="notepadAppopen"
                style="margin-right: 10px; margin-bottom: 36px;"
                src="./notebook-pen-icon.png" width="32" height="32">
            <p
                id="timeElement"
                style="text-align: right; margin-left: auto; padding-right: 30px;">
                Time
            </p>
        </div>
        <div id="notepadApp" class="window" style="top: 140px; left: 140px; visibility: hidden;">
            <div id="notepadAppheader" class="header">
                <span
                    style="flex-grow: 1; font-weight: bold; color: #ffffff; text-align: left;">Notepad</span>
                <span class="closebutton" id="notepadAppclose">
                    <img src="./Red_X.svg" width="20" height="20"
                        style="margin: 0;">
                </span>
            </div>
            <div class="content"
                style="display: flex; flex-direction: column; gap: 12px;">
                <textarea id="notepadText" placeholder="Write something down..."
                    style="width: 100%; height: 180px; resize: none; font-family: inherit; border: 1px solid rgba(0,0,0,0.2); border-radius: 12px; padding: 10px; box-sizing: border-box; background: rgba(255,255,255,0.6); outline: none;"></textarea>
                <div
                    style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button id="clearNotesBtn"
                        style="cursor: pointer; padding: 6px 12px; font-family: inherit; border-radius: 8px; border: 1px solid #000000; background: transparent;">Clear</button>
                    <button id="saveNotesBtn"
                        style="cursor: pointer; padding: 6px 12px; background-color: #000000; color: #ffffff; font-family: inherit; border-radius: 8px; border: none;">Save</button>
                </div>
            </div>
        </div>

        <div id="welcome" class="window"
            style="top: calc(50% - 90px); left: calc(50% - 180px); ">
            <div id="welcomeheader" class="header">
                <span
                    style="flex-grow: 1; font-weight: bold; color: #ffffff; text-align: left;">Welcome</span>
                <span
                    class="closebutton" id="welcomeclose">
                    <img src="./Red_X.svg" width="20" height="20"
                        style="margin: 0;">
                </span>
            </div>
            <div class="content">
                <img src="./goopOS-logo-bordered.png" width="480">

                <h1>Welcome to my <s>house</s> OS</h1>

                <h2>
                    This is
                    <span style="font-weight: bold; font-size: 155%;">
                        goopOS
                    </span>
                </h2>

                <p style="font-size: 75%;">
                    A little bit of goooop
                </p>

                <p style="text-align: left;">
                    Thanks to
                    <a href="https://stardance.hackclub.com/missions/web-os-1"
                        target="_blank"
                        style="font-weight: bold; font-size: 125%; color: #000000;">
                        Stardance
                    </a>
                    for the tutorial that led me to making this OS!
                </p>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
